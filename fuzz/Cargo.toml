[package]
name = "xdg-kit-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
description = "Fuzz targets for the xdg-kit parsers (cargo fuzz)"

[package.metadata]
cargo-fuzz = true

# Kept out of the main workspace: built only by cargo fuzz, on a nightly.
# Its own Cargo.lock: after `cargo update` in the workspace, run it here too,
# so the fuzzers test the dependency versions that ship.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
xdg-kit-desktop-entry = { path = "../crates/xdg-kit-desktop-entry" }
xdg-kit-mime = { path = "../crates/xdg-kit-mime" }
xdg-kit-mime-apps = { path = "../crates/xdg-kit-mime-apps" }
xdg-kit-autostart = { path = "../crates/xdg-kit-autostart" }
xdg-kit-basedir = { path = "../crates/xdg-kit-basedir" }
xdg-kit-bookmarks = { path = "../crates/xdg-kit-bookmarks" }
xdg-kit-icon-theme = { path = "../crates/xdg-kit-icon-theme" }
xdg-kit-thumbnails = { path = "../crates/xdg-kit-thumbnails" }

[[bin]]
name = "mime_cache"
path = "fuzz_targets/mime_cache.rs"
test = false
doc = false
bench = false

[[bin]]
name = "magic"
path = "fuzz_targets/magic.rs"
test = false
doc = false
bench = false

