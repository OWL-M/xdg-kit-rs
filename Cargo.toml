[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"

[workspace.dependencies]
libc = "0.2.190"
mime = "0.3"
quick-xml = "0.42"
rustix = { version = "1.1", default-features = false, features = ["std", "process"] }
tempfile = "3"
xdg-kit-basedir = { path = "crates/xdg-kit-basedir", version = "0.1.0" }
xdg-kit-desktop-entry = { path = "crates/xdg-kit-desktop-entry", version = "0.1.0" }
xdg-kit-locale = { path = "crates/xdg-kit-locale", version = "0.1.0" }
xdg-kit-mime = { path = "crates/xdg-kit-mime", version = "0.1.0" }
xdg-kit-mime-apps = { path = "crates/xdg-kit-mime-apps", version = "0.1.0" }
# Blocking D-Bus calls for `DBusActivatable` entries (`dbus` feature of the
# desktop entry crate).
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# `cargo fuzz` builds with `--cfg fuzzing` (see crates/xdg-kit-mime/src/fuzzing.rs).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Types are named after the spec's terms, which repeat the module names.
module_name_repetitions = "allow"
