[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/OWL-M/xdg-kit-rs"
readme = "README.md"

[workspace.dependencies]
libc = "0.2.190"
quick-xml = "0.42"
rustix = { version = "1.1", default-features = false, features = ["std", "process"] }
tempfile = "3"
xdg-kit-autostart = { path = "crates/xdg-kit-autostart", version = "0.1.0" }
xdg-kit-basedir = { path = "crates/xdg-kit-basedir", version = "0.1.0" }
xdg-kit-bookmarks = { path = "crates/xdg-kit-bookmarks", version = "0.1.0" }
xdg-kit-desktop-entry = { path = "crates/xdg-kit-desktop-entry", version = "0.1.0" }
xdg-kit-icon-theme = { path = "crates/xdg-kit-icon-theme", version = "0.1.0" }
xdg-kit-locale = { path = "crates/xdg-kit-locale", version = "0.1.0" }
xdg-kit-menu = { path = "crates/xdg-kit-menu", version = "0.1.0" }
xdg-kit-mime = { path = "crates/xdg-kit-mime", version = "0.1.0" }
xdg-kit-thumbnails = { path = "crates/xdg-kit-thumbnails", version = "0.1.0" }
xdg-kit-mime-apps = { path = "crates/xdg-kit-mime-apps", version = "0.1.0" }
# D-Bus calls for `DBusActivatable` entries (`dbus` feature of the desktop
# entry crate), driven by zbus's `block_on` on its own runtime, or on the
# Tokio runtime zbus keeps when something else turns its `tokio` feature on.
zbus = { version = "6.1", default-features = false, features = ["default-rt"] }
# The deadline of a D-Bus activation: a timer of the runtime zbus's
# `block_on` drives (the same per-thread runtime), so the library starts no
# thread for it. `helper` keeps the timer firing when some other runtime
# (zbus's `tokio` feature, unified in by another crate) drives the call
# instead: zruntime's own short-lived helper thread fires it then.
zruntime = { version = "0.2.1", default-features = false, features = ["runtime", "helper"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# `cargo fuzz` builds with `--cfg fuzzing` (see crates/xdg-kit-mime/src/fuzzing.rs).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Types are named after the spec's terms, which repeat the module names.
module_name_repetitions = "allow"
