[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"

[workspace.dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "process"] }
tempfile = "3"
xdg-kit-basedir = { path = "crates/xdg-kit-basedir", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Types are named after the spec's terms, which repeat the module names.
module_name_repetitions = "allow"
