[package]
name = "xdg-kit-desktop-entry"
description = "The freedesktop.org Desktop Entry spec: reading, lossless writing, validation, the installed entries by desktop file ID, and launching"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
documentation = "https://docs.rs/xdg-kit-desktop-entry"
keywords = ["xdg", "freedesktop", "desktop-entry", "desktop-file", "launcher"]
categories = ["os::unix-apis", "parser-implementations"]

[features]
## Launching applications through D-Bus activation (`DBusActivatable=true`).
dbus = ["dep:zbus", "dep:zruntime"]
# Not public API: compiles in the work counter of this crate's counted tests
# (`work` in src/key_file.rs), for the workspace's own tests only.
# `xdg-kit-mime-apps` turns it on in its dev-dependencies, so that its counted
# tests also count the work done in this crate. It may change or go at any
# time; nothing else should turn it on.
__count-work = []

[dependencies]
rustix = { workspace = true, features = ["fs"] }
xdg-kit-basedir.workspace = true
xdg-kit-locale.workspace = true
zbus = { workspace = true, optional = true }
zruntime = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
# The hidden `__count-work` feature (not public API): the bytes fed to the
# hashers of the shared maps keyed by text, for the tests that check a
# long key is not hashed again as a map grows.
xdg-kit-basedir = { workspace = true, features = ["__count-work"] }
# The D-Bus test (tests/dbus.rs) serves the application's interface.
zbus = { workspace = true, features = ["service"] }

[lints]
workspace = true
