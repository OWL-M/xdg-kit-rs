[package]
name = "xdg-kit-autostart"
description = "The Desktop Application Autostart spec: login autostart discovery, eligibility, launch plans, user overrides"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
documentation = "https://docs.rs/xdg-kit-autostart"
keywords = ["xdg", "freedesktop", "autostart", "desktop-entry", "session"]
categories = ["os::unix-apis", "filesystem"]

[features]
## Plans for `DBusActivatable=true` entries as D-Bus activation calls
## (the `dbus` feature of `xdg-kit-desktop-entry`).
dbus = ["xdg-kit-desktop-entry/dbus"]

[dependencies]
rustix = { workspace = true, features = ["fs"] }
xdg-kit-basedir.workspace = true
xdg-kit-desktop-entry.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The hidden `__count-work` feature (not public API) compiles in the key
# file's work counter, which this crate's counted tests count on too, so
# the parsing of each entry is part of the count.
xdg-kit-desktop-entry = { workspace = true, features = ["__count-work"] }

[lints]
workspace = true
