[package]
name = "xdg-kit-mime-apps"
description = "The freedesktop.org MIME Applications Associations spec: default and associated applications, mimeapps.list editing, mimeinfo.cache, opening files and URIs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
documentation = "https://docs.rs/xdg-kit-mime-apps"
keywords = ["xdg", "freedesktop", "mimeapps", "default-apps", "file-associations"]
categories = ["os::unix-apis", "filesystem", "parser-implementations"]

[dependencies]
rustix = { workspace = true, features = ["fs"] }
xdg-kit-basedir.workspace = true
xdg-kit-desktop-entry.workspace = true
xdg-kit-mime.workspace = true

# `O_SEARCH`, which rustix does not have, on the systems the libc crate
# defines it for (see `LOOKUPS_ONLY` in src/cache.rs).
[target.'cfg(any(target_vendor = "apple", target_os = "aix", target_os = "cygwin", target_os = "emscripten", target_os = "freebsd", target_os = "fuchsia", target_os = "illumos", target_os = "netbsd", target_os = "solaris"))'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The hidden `__count-work` feature (not public API) compiles in the key
# file's work counter, which the counted tests here share (see `work` in
# src/lib.rs). Dev-dependencies only: it is on when this crate's tests are
# built, never for those who depend on this crate.
xdg-kit-desktop-entry = { workspace = true, features = ["__count-work"] }
# The same feature of basedir: the bytes fed to the hashers of the shared
# maps keyed by text, for the tests that check a long key is not hashed
# again as a map grows.
xdg-kit-basedir = { workspace = true, features = ["__count-work"] }

[lints]
workspace = true
