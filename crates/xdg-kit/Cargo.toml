[package]
name = "xdg-kit"
description = "Freedesktop.org XDG specifications for Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# A link to the workspace's README, so that its doctests (src/lib.rs) also
# find it in the packaged crate.
readme = "README.md"
documentation = "https://docs.rs/xdg-kit"
keywords = ["xdg", "freedesktop", "mime", "desktop-entry", "mimeapps"]
categories = ["os::unix-apis", "filesystem", "parser-implementations", "config"]

[features]
default = ["basedir", "desktop-entry", "locale", "mime", "mime-apps"]
## The XDG Base Directory spec and user folders.
basedir = ["dep:xdg-kit-basedir"]
## Desktop entries: reading, writing, validation, installed entries by
## desktop file ID, launching.
desktop-entry = ["dep:xdg-kit-desktop-entry", "basedir"]
## D-Bus activation when launching `DBusActivatable` applications.
desktop-entry-dbus = ["desktop-entry", "xdg-kit-desktop-entry/dbus"]
## The user's languages, for translated values.
locale = ["dep:xdg-kit-locale"]
## The Shared MIME-info database.
mime = ["dep:xdg-kit-mime", "basedir"]
## Applications for MIME types: defaults, associations, `mimeapps.list`,
## opening files and URIs.
mime-apps = ["dep:xdg-kit-mime-apps", "desktop-entry", "mime", "basedir"]

[dependencies]
xdg-kit-basedir = { workspace = true, optional = true }
xdg-kit-desktop-entry = { workspace = true, optional = true }
xdg-kit-locale = { workspace = true, optional = true }
xdg-kit-mime = { workspace = true, optional = true }
xdg-kit-mime-apps = { workspace = true, optional = true }

[lints]
workspace = true
