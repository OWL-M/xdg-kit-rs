[package]
name = "xdg-kit-bookmarks"
description = "The Desktop Bookmark spec: recently-used.xbel, read and edited losslessly"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
documentation = "https://docs.rs/xdg-kit-bookmarks"
keywords = ["xdg", "freedesktop", "xbel", "recently-used", "bookmarks"]
categories = ["os::unix-apis", "filesystem", "parser-implementations"]

[dependencies]
quick-xml.workspace = true
rustix = { workspace = true, features = ["fs"] }
xdg-kit-basedir.workspace = true
xdg-kit-mime.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The hidden `__count-work` feature (not public API): the bytes fed to the
# hashers of the shared maps keyed by text, for the tests that check a
# long key is not hashed again as a map grows.
xdg-kit-basedir = { workspace = true, features = ["__count-work"] }

[lints]
workspace = true
