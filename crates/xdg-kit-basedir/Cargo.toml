[package]
name = "xdg-kit-basedir"
description = "The XDG Base Directory spec and XDG user folders"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
documentation = "https://docs.rs/xdg-kit-basedir"
keywords = ["xdg", "freedesktop", "basedir", "user-dirs", "config"]
categories = ["os::unix-apis", "filesystem", "config"]

[features]
# Not public API: the count of bytes fed to the hashers of `__hashed`'s
# maps (`__hashed::fed`), for the workspace's own tests. Turned on by the
# other crates' dev-dependencies. It may change or go at any time; nothing
# else should turn it on.
__count-work = []

[dependencies]
rustix = { workspace = true, features = ["fs"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
