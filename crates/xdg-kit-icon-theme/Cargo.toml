[package]
name = "xdg-kit-icon-theme"
description = "The Icon Theme spec: index.theme inheritance and themed icon lookup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
documentation = "https://docs.rs/xdg-kit-icon-theme"
keywords = ["xdg", "freedesktop", "icons", "icon-theme", "hicolor"]
categories = ["os::unix-apis", "filesystem", "gui"]

[dependencies]
xdg-kit-basedir.workspace = true
xdg-kit-desktop-entry.workspace = true
xdg-kit-locale.workspace = true

[dev-dependencies]
rustix = { workspace = true, features = ["fs"] }
tempfile.workspace = true
# The hidden `__count-work` feature (not public API): the bytes fed to the
# hashers of the shared maps keyed by text, for the tests that check a
# long key is not hashed again as a map grows.
xdg-kit-basedir = { workspace = true, features = ["__count-work"] }

[lints]
workspace = true
