[package]
name = "xdg-kit-mime"
description = "The freedesktop.org Shared MIME-info database: file types, their relationships, icons and descriptions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0 AND Unicode-3.0"
repository.workspace = true
readme.workspace = true
documentation = "https://docs.rs/xdg-kit-mime"
keywords = ["xdg", "freedesktop", "mime", "shared-mime-info", "file-type"]
categories = ["os::unix-apis", "filesystem", "parser-implementations"]

[dependencies]
quick-xml.workspace = true
rustix = { workspace = true, features = ["fs"] }
xdg-kit-basedir.workspace = true
xdg-kit-locale.workspace = true

# `O_SEARCH`, which rustix does not have, on the systems the libc crate
# defines it for (see `LOOKUPS_ONLY` in src/tree.rs).
[target.'cfg(any(target_vendor = "apple", target_os = "aix", target_os = "cygwin", target_os = "emscripten", target_os = "freebsd", target_os = "fuchsia", target_os = "illumos", target_os = "netbsd", target_os = "solaris"))'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The hidden `__count-work` feature (not public API): the bytes fed to the
# hashers of the shared maps keyed by text, for the tests that check a
# long key is not hashed again as a map grows.
xdg-kit-basedir = { workspace = true, features = ["__count-work"] }

[lints]
workspace = true
